name: Node PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: Jungle-Grid/.github/.github/workflows/reusable-node-pr-ci.yml@main # Replace main with a reviewed commit SHA after installing.
    permissions:
      contents: read
    with:
      node-version: "20"
      package-manager: "npm"
      working-directory: "."
      run-lint: false
      run-format: false
      run-typecheck: false
      run-tests: true
      run-build: true
